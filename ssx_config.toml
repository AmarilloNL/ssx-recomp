# Recompiler settings shared by every game version. The version-specific parts (function
# addresses, hooks) are in ssx_config_v<version>.toml; CMakeLists.txt copies the one matching the
# game being built to game-dump/ssx_version.toml, which ssx_manifest.toml includes.

# Performance: keep these PPC registers in C++ locals (host registers) instead of
# the PPCContext in memory. non_volatile_as_local / skip_lr are left off (they
# interact with setjmp/longjmp and exception unwinding).
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = false
non_argument_as_local = false
skip_msr = false
