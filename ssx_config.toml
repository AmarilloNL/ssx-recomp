# Manual analysis overrides for default.xex (title 4541096D, v0.0.0.2).

# Performance: keep these PPC registers in C++ locals (host registers) instead of
# the PPCContext in memory. non_volatile_as_local / skip_lr are left off (they
# interact with setjmp/longjmp and exception unwinding).
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = false
non_argument_as_local = false
skip_msr = false

# Present interval chosen per frame from the device's setting (2 = 30 fps on a 60 Hz
# vblank). The hook replaces it with the ssx_framerate setting.
[[midasm_hook]]
address = 0x8233CB10
name = "SsxPresentInterval"
registers = ["r11"]
after_instruction = true

